[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "predmaint"
dynamic = ["version"]
description = "RUL prediction on NASA C-MAPSS FD001 with a FastAPI service and a Streamlit dashboard."
readme = "README.md"
requires-python = ">=3.13,<3.14"
# Dependencies are pinned in requirements.txt / requirements-dev.txt only (docs/03 §3).

[tool.setuptools.dynamic]
version = { attr = "predmaint.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage gate (docs/09 §6): CI and plain `pytest` fail below 85 %. Running a subset of tests?
# add --no-cov, otherwise the gate counts only that subset.
addopts = "-ra --cov=predmaint --cov-report=term-missing:skip-covered --cov-fail-under=85"
markers = [
    "data: needs the real FD001 files under DATA_DIR (skipped when absent)",
    "network: downloads from the NASA S3 URL (runs only with RUN_NETWORK_TESTS=1)",
    "docker: builds the image and runs scripts/smoke_test.sh (runs only with RUN_DOCKER_TESTS=1; use --no-cov)",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
source = ["predmaint"]
omit = ["*/predmaint/dashboard/app.py"]
